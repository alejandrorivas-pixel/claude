<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magno Tutorial — GitHub, Supabase & IA</title>
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>
  <!-- Barra superior -->
  <header id="topbar">
    <div class="topbar-left">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <div class="topbar-title">magno@tutorial:~$</div>
    <div class="topbar-right">
      <span id="progress-display">[----------] 0/10</span>
    </div>
  </header>

  <div id="main-layout">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">Lecciones</div>
      <ul id="lesson-list">
        <li data-lesson="0" class="active">
          <span class="check"></span> Bienvenida
        </li>
        <li data-lesson="1">
          <span class="check"></span> ¿Qué es GitHub?
        </li>
        <li data-lesson="2">
          <span class="check"></span> Repositories
        </li>
        <li data-lesson="3">
          <span class="check"></span> Commits
        </li>
        <li data-lesson="4">
          <span class="check"></span> Branches
        </li>
        <li data-lesson="5">
          <span class="check"></span> Pull Requests
        </li>
        <li data-lesson="6">
          <span class="check"></span> Vibe Coding + GitHub
        </li>
        <li data-lesson="7">
          <span class="check"></span> Flujo de Trabajo
        </li>
        <li data-lesson="8">
          <span class="check"></span> Supabase
        </li>
        <li data-lesson="9">
          <span class="check"></span> Modelos de IA
        </li>
      </ul>
      <button id="sidebar-toggle" aria-label="Alternar sidebar">☰</button>
    </nav>

    <!-- Terminal -->
    <main id="terminal">
      <div id="terminal-output"></div>
    </main>
  </div>

  <!-- Barra de input -->
  <footer id="input-bar">
    <span class="prompt-symbol">$</span>
    <input type="text" id="command-input" placeholder="Escribe 'next', 'prev', 'menu' o 'help'..." autocomplete="off" spellcheck="false">
    <div id="nav-buttons">
      <button id="btn-prev" title="Lección anterior">◀</button>
      <button id="btn-next" title="Siguiente lección">▶</button>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
